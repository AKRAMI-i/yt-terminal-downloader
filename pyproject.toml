[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-terminal-downloader"
version = "0.1.0"
description = "A stylish terminal YouTube downloader"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "rich>=13.7"
]

[project.scripts]
yt = "main:main"

[tool.setuptools]
py-modules = ["main"]